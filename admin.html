<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Pase Élite</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <h1>🔥 PASE ÉLITE ADMIN</h1>
        <a href="index.html" class="btn-tienda" style="background:#ff9800; color:#000; padding:8px 15px; border-radius:5px; text-decoration:none; font-weight:bold; display:inline-block; margin-top:10px;">TIENDA</a>
    </header>

    <main class="container">
        <!-- Sección de Inicio de Sesión -->
        <section id="loginSection" class="card-main">
            <h2>🔒 Panel de administración</h2>
            <div class="form-group">
                <label for="adminEmail">Correo del administrador</label>
                <input type="email" id="adminEmail" placeholder="tucorreo@gmail.com">
            </div>
            <div class="form-group">
                <label for="adminPassword">Contraseña</label>
                <input type="password" id="adminPassword" placeholder="••••••••">
            </div>
            <button class="btn-whatsapp" onclick="loginAdmin()">🔑 INICIAR SESIÓN</button>
        </section>

        <!-- Sección de Configuración (Oculta hasta iniciar sesión) -->
        <section id="adminSection" class="card-main" style="display: none;">
            <h2>⚙️ Configuración de la tienda</h2>
            
            <div class="form-group">
                <label for="editTitle">Título de la tienda</label>
                <input type="text" id="editTitle">
            </div>

            <div class="form-group">
                <label for="editDescription">Descripción / Aviso de Pago</label>
                <textarea id="editDescription" rows="3" style="width:100%; background:#111; color:#fff; border:1px solid #333; padding:10px; border-radius:5px;"></textarea>
            </div>

            <div class="form-group">
                <label for="editPriceCOP">Precio en COP</label>
                <input type="number" id="editPriceCOP">
            </div>

            <div class="form-group">
                <label for="editPriceUSD">Precio en USD</label>
                <input type="number" step="0.01" id="editPriceUSD">
            </div>

            <div class="form-group">
                <label for="editWhatsapp">WhatsApp de contacto (con código de país)</label>
                <input type="text" id="editWhatsapp" placeholder="573157874619">
            </div>

            <button class="btn-whatsapp" onclick="guardarConfiguracion()" style="background: #4CAF50; color: white; margin-top: 15px;">💾 GUARDAR CAMBIOS</button>
            <button class="btn-whatsapp" onclick="cerrarSesion()" style="background: #f44336; color: white; margin-top: 10px;">🚪 CERRAR SESIÓN</button>
        </section>
    </main>

    <!-- Script de Firebase y lógica del Admin -->
    <script type="module" src="admin.js"></script>
</body>
</html>
