<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Panel de Administración</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">
    <div class="logo">🔥 PASE ÉLITE ADMIN</div>

    <a href="index.html" class="header-btn">
        TIENDA
    </a>
</header>


<main class="section">

    <h2>🔐 Panel de administración</h2>


    <!-- LOGIN -->

    <div id="loginBox" class="form-box">

        <label>Correo del administrador</label>

        <input
            type="email"
            id="email"
            placeholder="Tu correo"
        >


        <label>Contraseña</label>

        <input
            type="password"
            id="password"
            placeholder="Tu contraseña"
        >


        <button
            type="button"
            class="buy-btn"
            onclick="login()"
        >
            🔐 INICIAR SESIÓN
        </button>

        <p
            id="loginMessage"
            class="small-text"
        ></p>

    </div>


    <!-- ADMIN PANEL -->

    <div
        id="adminPanel"
        class="form-box"
        style="display:none;"
    >

        <h2>⚙️ Configuración de la tienda</h2>


        <label>Título de la tienda</label>

        <input
            type="text"
            id="title"
            placeholder="PASE ÉLITE"
        >


        <label>Descripción</label>

        <input
            type="text"
            id="description"
            placeholder="Descripción de la tienda"
        >


        <label>Precio en COP</label>

        <input
            type="number"
            id="priceCOP"
            placeholder="7000"
        >


        <label>Precio en USD</label>

        <input
            type="number"
            step="0.01"
            id="priceUSD"
            placeholder="2.09"
        >


        <label>WhatsApp</label>

        <input
            type="text"
            id="whatsapp"
            placeholder="573001234567"
        >

        <p class="small-text">
            Escribe el número con código de país.
            Ejemplo Colombia: 573001234567
        </p>


        <label>Beneficios</label>

        <textarea
            id="benefits"
            rows="10"
            style="
                width:100%;
                background:#171717;
                color:white;
                border:1px solid #333;
                border-radius:9px;
                padding:15px;
                font-size:15px;
            "
        ></textarea>


        <label>Top compradores</label>

        <textarea
            id="topBuyers"
            rows="8"
            style="
                width:100%;
                background:#171717;
                color:white;
                border:1px solid #333;
                border-radius:9px;
                padding:15px;
                font-size:15px;
            "
        ></textarea>


        <label>Preguntas frecuentes</label>

        <textarea
            id="faq"
            rows="12"
            style="
                width:100%;
                background:#171717;
                color:white;
                border:1px solid #333;
                border-radius:9px;
                padding:15px;
                font-size:15px;
            "
        ></textarea>


        <button
            type="button"
            class="buy-btn"
            onclick="guardar()"
        >
            💾 GUARDAR CAMBIOS
        </button>


        <button
            type="button"
            onclick="logout()"
            style="
                width:100%;
                margin-top:15px;
                padding:14px;
                border:1px solid #333;
                border-radius:9px;
                background:#171717;
                color:#fff;
                font-weight:bold;
                cursor:pointer;
            "
        >
            🚪 CERRAR SESIÓN
        </button>


        <p
            id="message"
            class="small-text"
        ></p>

    </div>

</main>


<footer>

    <div class="footer-logo">
        🔥 PASE ÉLITE SHOP
    </div>

    <p>
        Panel privado de administración
    </p>

</footer>


<script type="module" src="admin.js"></script>

</body>
</html>
