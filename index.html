<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pase Élite - Tienda</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <!-- Encabezado de la Tienda -->
        <header>
            <h1 id="storeTitle">PASE ÉLITE</h1>
            <p id="storeDescription">Consigue tu Pase Élite de Free Fire.</p>
        </header>

        <!-- Tarjeta de Compra -->
        <div class="card">
            <div class="price-container">
                <span id="priceCOP">8000 COP</span>
                <span id="priceUSD">2.39 USD</span>
            </div>

            <div class="input-group">
                <label for="playerId">ID de Free Fire</label>
                <input type="text" id="playerId" placeholder="Ingresa tu ID">
            </div>

            <div class="input-group">
                <label for="playerName">Nombre en el juego</label>
                <input type="text" id="playerName" placeholder="Ingresa tu nombre">
            </div>

            <div class="input-group">
                <label for="cantidad">Cantidad de Pases</label>
                <div class="quantity-box">
                    <button type="button" onclick="changeQuantity(-1)">-</button>
                    <input type="number" id="cantidad" value="1" min="1">
                    <button type="button" onclick="changeQuantity(1)">+</button>
                </div>
            </div>

            <div class="total-container">
                <span>Total:</span>
                <strong id="total">8000 COP</strong>
            </div>

            <!-- 💳 Selector de Método de Pago (Añadido exactamente como lo pediste) -->
            <div style="margin: 15px 0; text-align: left;">
                <label style="display: block; color: #ff9800; font-weight: bold; margin-bottom: 8px; font-size: 14px;">💳 Selecciona tu método de pago:</label>
                
                <div style="display: flex; flex-direction: column; gap: 8px;">
                    <!-- Opción Nequi (Activa) -->
                    <label style="display: flex; align-items: center; background: rgba(255, 152, 0, 0.1); border: 2px solid #ff9800; padding: 10px; border-radius: 8px; cursor: pointer; color: #fff;">
                        <input type="radio" name="paymentMethod" value="Nequi" checked style="accent-color: #ff9800; margin-right: 10px; transform: scale(1.1);">
                        <div style="flex-grow: 1;">
                            <span style="font-weight: bold; font-size: 14px;">💜 Nequi</span>
                            <span style="display: block; font-size: 11px; color: #bbb;">Transfiere al: 315 787 4619</span>
                        </div>
                    </label>

                    <!-- Opción PayPal (Próximamente) -->
                    <label style="display: flex; align-items: center; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); padding: 10px; border-radius: 8px; opacity: 0.5; cursor: not-allowed;">
                        <input type="radio" name="paymentMethod" value="PayPal" disabled style="margin-right: 10px; transform: scale(1.1);">
                        <div style="flex-grow: 1;">
                            <span style="font-weight: bold; font-size: 14px; color: #888;">💙 PayPal</span>
                            <span style="display: block; font-size: 11px; color: #777;">Próximamente</span>
                        </div>
                    </label>
                </div>
            </div>

            <button class="btn-comprar" onclick="comprar()">📲 PEDIR POR WHATSAPP</button>
        </div>

        <!-- Beneficios -->
        <div class="section">
            <h2>Beneficios</h2>
            <div id="benefits"></div>
        </div>

        <!-- Top Compradores -->
        <div class="section">
            <h2>Top Compradores</h2>
            <div id="topBuyers"></div>
        </div>

        <!-- FAQ -->
        <div class="section">
            <h2>Preguntas Frecuentes</h2>
            <div id="faq"></div>
        </div>

        <footer>
            <p><a href="admin.html">Panel de administración</a></p>
        </footer>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
