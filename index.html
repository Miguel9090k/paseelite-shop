<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pase Élite - Tienda Oficial</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header / Título Principal -->
    <header class="header">
        <h1 id="storeTitle">PASE ÉLITE</h1>
        <p id="storeDescription">Consigue tu Pase Élite de Free Fire de forma rápida y segura.</p>
    </header>

    <!-- Contenedor Principal de Compra -->
    <main class="container">
        <section class="card-main">
            <h2>🔥 Adquiere tu Pase Élite</h2>
            
            <div class="price-box">
                <span id="priceCOP">$8,000 COP</span>
                <span id="priceUSD">US$2.39</span>
            </div>

            <!-- Formulario de Compra -->
            <div class="form-group">
                <label for="playerId">Tu ID de Free Fire:</label>
                <input type="text" id="playerId" placeholder="Ej: 123456789">
            </div>

            <div class="form-group">
                <label for="playerName">Tu Nombre en el Juego:</label>
                <input type="text" id="playerName" placeholder="Ej: TuNombreFF">
            </div>

            <div class="form-group">
                <label for="cantidad">Cantidad de Pases:</label>
                <div class="quantity-control">
                    <button onclick="changeQuantity(-1)">-</button>
                    <input type="number" id="cantidad" value="1" min="1">
                    <button onclick="changeQuantity(1)">+</button>
                </div>
            </div>

            <div class="total-box">
                <span>Total a Pagar:</span>
                <strong id="total">$8,000 COP</strong>
            </div>

            <!-- Selector de Método de Pago -->
            <div class="payment-method-container" style="margin: 20px 0; text-align: left;">
                <label style="display: block; color: #ff9800; font-weight: bold; margin-bottom: 8px;">💳 Selecciona tu método de pago:</label>
                
                <div style="display: grid; grid-template-columns: 1fr; gap: 10px;">
                    <!-- Opción Nequi (Activa) -->
                    <label style="display: flex; align-items: center; background: rgba(255, 152, 0, 0.1); border: 2px solid #ff9800; padding: 12px; border-radius: 10px; cursor: pointer; color: #fff;">
                        <input type="radio" name="paymentMethod" value="Nequi" checked style="accent-color: #ff9800; margin-right: 10px; transform: scale(1.2);">
                        <div style="flex-grow: 1;">
                            <span style="font-weight: bold; font-size: 16px;">💜 Nequi</span>
                            <span style="display: block; font-size: 12px; color: #bbb;">Transfiere al: 315 787 4619</span>
                        </div>
                    </label>

                    <!-- Opción PayPal (Próximamente / Desactivada) -->
                    <label style="display: flex; align-items: center; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); padding: 12px; border-radius: 10px; opacity: 0.5; cursor: not-allowed;">
                        <input type="radio" name="paymentMethod" value="PayPal" disabled style="margin-right: 10px; transform: scale(1.2);">
                        <div style="flex-grow: 1;">
                            <span style="font-weight: bold; font-size: 16px; color: #888;">💙 PayPal</span>
                            <span style="display: block; font-size: 12px; color: #777;">Próximamente</span>
                        </div>
                    </label>
                </div>
            </div>

            <!-- Botón de Compra por WhatsApp -->
            <button class="btn-whatsapp" onclick="comprar()">📲 PEDIR POR WHATSAPP</button>
        </section>

        <!-- Beneficios -->
        <section>
            <h2>✨ Beneficios</h2>
            <div id="benefits" class="grid-benefits"></div>
        </section>

        <!-- Top Compradores -->
        <section>
            <h2>🏆 Top Compradores</h2>
            <div id="topBuyers" class="list-buyers"></div>
        </section>

        <!-- Preguntas Frecuentes -->
        <section>
            <h2>❓ Preguntas Frecuentes</h2>
            <div id="faq" class="faq-container"></div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <p>🛒 PaseEliteShop &copy; 2026 - Todos los derechos reservados.</p>
        <p><a href="admin.html" style="color: #ff9800; text-decoration: none; font-size: 12px;">Panel de administración</a></p>
    </footer>

    <!-- Script principal -->
    <script type="module" src="app.js"></script>
</body>
</html>
